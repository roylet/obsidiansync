name: Release plugin

# Obsidian's submission bot requires the release tag to equal the version in
# manifest.json exactly, with no `v` prefix - so plugin releases use bare
# semver tags, while the server image uses `v`-prefixed ones.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag must match the manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./apps/plugin/manifest.json').version")
          if [ "$MANIFEST_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "manifest.json says $MANIFEST_VERSION but the tag is ${GITHUB_REF_NAME}"
            echo "The Obsidian submission bot rejects releases where these differ."
            exit 1
          fi

      - run: pnpm -r build
      - run: pnpm test

      - name: Confirm the bundle stayed mobile-safe
        working-directory: apps/plugin
        run: |
          # A stray Node import would break the plugin on iOS and Android only,
          # which is the hardest place to notice it. "obsidian" is the sole
          # module the bundle is allowed to require.
          UNEXPECTED=$(grep -oE 'require\("[^"]+"\)' main.js | sort -u | grep -v '^require("obsidian")$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "the bundle requires modules that do not exist on mobile:"
            echo "$UNEXPECTED"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/plugin
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css
