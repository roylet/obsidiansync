name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: the server imports the protocol package's compiled output,
      # so a type error there should fail here rather than in the image build.
      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build without pushing, so a broken Dockerfile fails the PR rather than
      # the release.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: obsidiansync:ci

      - name: Server starts and answers the health check
        run: |
          docker run -d --name sync -p 8080:8080 -e DATA_DIR=/data obsidiansync:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/v1/health; then
              echo "server is up"
              docker rm -f sync
              exit 0
            fi
            sleep 2
          done
          echo "server did not become healthy"
          docker logs sync
          exit 1
